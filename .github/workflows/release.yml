name: Build and Release Zentwik

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的 tag 时触发
  workflow_dispatch: # 允许在 Actions 页面手动点击运行
    inputs:
      tag_name:
        description: '要发布的 Tag 名称 (例如 v1.2.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.inputs.tag_name || github.ref }} # 如果是手动触发，切换到指定的 tag

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 双进程发布：UI 与 Worker 由同一次发布产出、装进同一目录。
    # 两条 publish 必须指向同一个 -o —— 只发一个 exe 的包，UI 启动时会拉不起 Worker，
    # 表现为「永远显示未连接」，且没有任何报错。
    #
    # 两端参数一致，逐项理由：
    #   · --self-contained false：产品口径是「用户自装 .NET 10 Runtime」，不随包带运行时；
    #   · PublishSingleFile=true：每端只出一个 exe，安装目录干净；
    #   · WinIo32.dll 不会被打进单文件 —— Core 的 csproj 对它标了 ExcludeFromSingleFile=true，
    #     它必须与 exe 同目录落地（ZenStates-Core 按文件名自己 LoadLibrary，不认单文件
    #     解包目录）。两个工程各引用一次 Core，会各写一份内容相同的副本到同一目录，
    #     后写的覆盖先写的，无副作用。因此不需要给 Worker 单独加 ExcludeFromSingleFile。
    #   · PublishReadyToRun：UI 冷启动收益明确，Worker 是登录后常驻进程、同样受益，保持一致。
    - name: Publish UI
      run: |
        dotnet publish Zentwik.UI/Zentwik.UI.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -p:PublishSingleFile=true -o ./publish

    - name: Publish Worker
      run: |
        dotnet publish Zentwik.Worker/Zentwik.Worker.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -p:PublishSingleFile=true -o ./publish

    - name: Create Zip Archive
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./Zentwik-win-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }} # 手动触发用 input，推送触发用 ref_name
        files: ./Zentwik-win-x64.zip
        generate_release_notes: true
        # canary（can）构建必须标成预发布：GitHub 会把「最新版本」给非预发布项，
        # 一旦 can 被当成正式版，所有走 /releases/latest 的下载入口都会拿到
        # 一个尚未实机验证的构建。v2.0.0-can1 当初是手工勾的预发布，
        # v2.0.0-can2 就漏成了正式版 —— 说明靠人记得勾不可靠，写进流程里。
        prerelease: ${{ contains(github.ref_name, 'can') || contains(github.event.inputs.tag_name, 'can') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
